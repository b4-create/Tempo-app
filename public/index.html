<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo — Scheduling and Event Reminder</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#ececec;--panel:#fff;--border:#d7d7d7;--text:#202020;--muted:#777;--sidebar:#171717;--accent:#202020;
  --input-bg:#fff;--input-border:#ccc;--secondary-bg:#f5f5f5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151515;--panel:#1f1f1f;--border:#333;--text:#eee;--muted:#999;--sidebar:#0d0d0d;--accent:#e8e8e8;
    --input-bg:#252525;--input-border:#444;--secondary-bg:#2a2a2a;
  }
}
:root[data-theme="dark"]{
  --bg:#151515;--panel:#1f1f1f;--border:#333;--text:#eee;--muted:#999;--sidebar:#0d0d0d;--accent:#e8e8e8;
  --input-bg:#252525;--input-border:#444;--secondary-bg:#2a2a2a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--sidebar);color:#fff;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 24px;z-index:5;overflow-y:auto;display:flex;flex-direction:column}
.brand{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:28px}
.nav button{display:block;width:100%;padding:12px 14px;margin:6px 0;border:0;border-radius:8px;background:transparent;color:#ddd;text-align:left}
.nav button:hover,.nav button.active{background:#303030;color:#fff}
.back{margin-top:25px!important;border-top:1px solid #333!important;border-radius:0!important}
.main{margin-left:220px;min-height:100vh;padding:30px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}
h1,h2,h3,p{margin-top:0}.topbar h1{margin-bottom:7px}.topbar p{color:var(--muted);max-width:760px;line-height:1.5}
.plus{width:44px;height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--bg);font-size:25px;flex-shrink:0}
.card,.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 2px 7px #0000000b}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.class-grid,.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.class-card,.subject-card{cursor:pointer;transition:.15s}.class-card:hover,.subject-card:hover{transform:translateY(-2px);box-shadow:0 5px 16px #0002}
.muted{color:var(--muted)}.small{font-size:13px}.hidden{display:none!important}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
input,textarea,select{width:100%;padding:10px 11px;border:1px solid var(--input-border);border-radius:7px;background:var(--input-bg)}
textarea{min-height:90px;resize:vertical}
.primary{border:0;background:var(--accent);color:var(--bg);padding:11px 16px;border-radius:7px}
.secondary{border:1px solid var(--input-border);background:var(--secondary-bg);padding:10px 15px;border-radius:7px}
.row{display:flex;gap:10px;align-items:center}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.dynamic{margin-top:10px}.dynamic-row{display:grid;grid-template-columns:1fr 42px;gap:8px;margin:7px 0}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.week,.day{padding:10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:64px}
.week{min-height:auto;background:var(--secondary-bg);font-weight:bold;text-align:center;font-size:12px}
.day{background:var(--panel);cursor:pointer}.day:hover{background:var(--secondary-bg)}
.day.selected{outline:2px solid var(--accent);outline-offset:-2px}.day.has-items{background:var(--secondary-bg)}
.day-num{font-weight:bold;font-size:13px}
.badge{display:inline-block;margin-top:6px;background:var(--accent);color:var(--bg);padding:3px 6px;border-radius:10px;font-size:10px}
.folder-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.folder-add{position:relative}
.add-menu{position:absolute;right:0;top:42px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 5px 20px #0004;min-width:150px;z-index:10}
.add-menu button{display:block;width:100%;border:0;background:var(--panel);padding:10px;text-align:left}
.add-menu button:hover{background:var(--secondary-bg)}
.item{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.item:last-child{border-bottom:0}.item-main{flex:1;min-width:150px}
.type{font-size:11px;font-weight:bold;text-transform:uppercase;color:var(--muted)}
.item img{width:70px;height:70px;object-fit:cover;border-radius:7px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:600px){.info-grid{grid-template-columns:1fr}}
.info-box{background:var(--secondary-bg);padding:15px;border-radius:8px}
.teacher-list,.subject-list{margin:0;padding-left:20px;line-height:1.8}
.subject-detail{margin-top:18px}
.event-table{width:100%;border-collapse:collapse}
.event-table th,.event-table td{text-align:left;padding:11px;border-bottom:1px solid var(--border);vertical-align:top}
.event-table th{background:var(--secondary-bg);font-size:13px}
.table-wrap{overflow-x:auto}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal-box{background:var(--panel);width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:22px}
.toast{position:fixed;right:25px;bottom:calc(25px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--bg);padding:12px 16px;border-radius:8px;display:none;z-index:50}
/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;width:min(420px,100%);box-shadow:0 8px 30px #0001}
.auth-card h1{margin:0 0 6px;font-size:24px}
.auth-card .sub{color:var(--muted);margin-bottom:22px;font-size:14px}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}
.auth-tabs button{flex:1;padding:10px;border:1px solid var(--border);background:var(--secondary-bg);border-radius:8px}
.auth-tabs button.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.auth-error{background:#fee;color:#c00;padding:10px 12px;border-radius:7px;margin-bottom:14px;font-size:13px;display:none}
.user-bar{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:20px;border-top:1px solid #333;color:#aaa;font-size:13px}
.user-bar button{margin-left:auto;background:transparent;border:1px solid #555;color:#ccc;padding:6px 10px;border-radius:6px;font-size:12px}
/* ===== Mobile menu button (hidden on desktop) ===== */
.menu-toggle{
  display:none;
  position:fixed;
  top:calc(12px + env(safe-area-inset-top,0px));
  left:12px;
  z-index:30;
  width:44px;height:44px;
  border:0;border-radius:10px;
  background:var(--sidebar);color:#fff;
  font-size:22px;line-height:1;
  box-shadow:0 2px 10px #0004;
}
body.logged-in .menu-toggle{display:none} /* desktop default */
@media(max-width:720px){
  body.logged-in .menu-toggle{display:flex;align-items:center;justify-content:center}
}
.sidebar-overlay{
  display:none;
  position:fixed;inset:0;
  background:#0006;z-index:15;
}

/* ===== Responsive ===== */
@media(max-width:900px){
  .sidebar{width:200px}
  .main{margin-left:200px;padding:20px}
  .week,.day{padding:8px;min-height:56px;font-size:12px}
}

@media(max-width:720px){
  .sidebar{
    position:fixed;
    left:0;top:0;bottom:0;
    width:min(280px,85vw);
    z-index:20;
    transform:translateX(-105%);
    transition:transform .25s ease;
    padding-top:calc(20px + env(safe-area-inset-top,0px));
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .main{
    margin-left:0;
    padding:16px;
    padding-top:calc(70px + env(safe-area-inset-top,0px));
  }
  .brand{font-size:17px;margin-bottom:20px}
  .nav button{padding:14px 16px;font-size:15px;margin:4px 0}
  .user-bar{margin-top:20px}
  .topbar{gap:12px;margin-bottom:20px}
  .topbar h1{font-size:22px}
  .plus{width:48px;height:48px;font-size:26px}
  .class-grid,.subject-grid{grid-template-columns:1fr;gap:12px}
  .calendar{font-size:12px}
  .week,.day{padding:6px 4px;min-height:48px}
  .day-num{font-size:12px}
  .badge{font-size:9px;padding:2px 5px}
  .item{flex-direction:column;gap:10px}
  .item img{width:100%;max-width:200px;height:auto;max-height:140px}
  .modal{padding:10px;align-items:flex-end}
  .modal-box{
    width:100%;
    max-height:92vh;
    border-radius:16px 16px 0 0;
    padding:18px;
  }
  .auth-card{padding:24px 20px}
  .form-grid{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
  .actions{flex-direction:column-reverse}
  .actions button{width:100%}
  .toolbar{gap:8px}
  .folder-head{gap:12px}
  input,textarea,select,button.primary,button.secondary{
    min-height:44px; /* better touch targets */
  }
  .event-table th,.event-table td{padding:10px 8px;font-size:13px}
}

@media(max-width:400px){
  .main{padding:12px;padding-top:calc(64px + env(safe-area-inset-top,0px))}
  .topbar h1{font-size:20px}
  .week,.day{min-height:42px;padding:4px 2px;font-size:11px}
  .badge{display:block;margin-top:3px}
}
</style>
</head>
<body>
<button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <h1>Tempo</h1>
    <p class="sub">Scheduling &amp; Event Reminder</p>
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="showAuthTab('login')">Login</button>
      <button id="tabRegister" onclick="showAuthTab('register')">Register</button>
    </div>
    <div id="authError" class="auth-error"></div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div style="margin-bottom:12px"><label>Username</label><input name="username" required autocomplete="username"></div>
      <div style="margin-bottom:18px"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
      <button class="primary" style="width:100%">Login</button>
    </form>
    <form id="registerForm" class="hidden" onsubmit="doRegister(event)">
      <div style="margin-bottom:12px"><label>Username</label><input name="username" required minlength="3" autocomplete="username"></div>
      <div style="margin-bottom:12px"><label>Display Name</label><input name="displayName" placeholder="Optional"></div>
      <div style="margin-bottom:18px"><label>Password</label><input name="password" type="password" required minlength="6" autocomplete="new-password"></div>
      <button class="primary" style="width:100%">Create Account</button>
    </form>
  </div>
</div>

<div id="appShell" class="hidden">
<aside class="sidebar">
  <div class="brand">Tempo<br><span style="font-weight:400;font-size:13px;opacity:.7">Scheduling &amp; Event Reminder</span></div>
  <div id="nav" class="nav"></div>
  <div class="user-bar">
    <span id="userLabel"></span>
    <button onclick="logout()">Logout</button>
  </div>
</aside>
<main class="main">
  <div id="app"></div>
</main>
</div>
<div id="toast" class="toast"></div>

<script>
const API = ''; // same origin
let token = localStorage.getItem('tempo_token') || null;

function toggleSidebar() {
  const sb = document.querySelector('.sidebar');
  const ov = document.getElementById('sidebarOverlay');
  if (!sb) return;
  const opening = !sb.classList.contains('open');
  sb.classList.toggle('open', opening);
  ov.classList.toggle('show', opening);
  document.body.style.overflow = opening ? 'hidden' : '';
}
function closeSidebar() {
  document.querySelector('.sidebar')?.classList.remove('open');
  document.getElementById('sidebarOverlay')?.classList.remove('show');
  document.body.style.overflow = '';
}
// Close drawer after any nav action on mobile
document.addEventListener('click', (e) => {
  if (e.target.closest('.nav button') || e.target.closest('.user-bar button')) {
    closeSidebar();
  }
});
let currentUser = null;
let classrooms = [];
let currentClassroom = null;
let page = 'dashboard';
let selectedDate = new Date().toISOString().slice(0,10);
let calendarDate = new Date();
let selectedSubject = null;
let itemType = 'event';

const app = document.getElementById('app');
const nav = document.getElementById('nav');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

async function api(path, options = {}) {
  const headers = options.headers || {};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (!(options.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + path, { ...options, headers });
  if (res.status === 401) {
    logout(true);
    throw new Error('Session expired');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ========== AUTH ==========
function showAuthTab(tab) {
  document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
  document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
  document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
  document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  document.getElementById('authError').style.display = 'none';
}
function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.style.display = 'block';
}
async function doLogin(e) {
  e.preventDefault();
  const f = e.target;
  try {
    const data = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ username: f.username.value.trim(), password: f.password.value })
    });
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('tempo_token', token);
    enterApp();
  } catch (err) {
    showAuthError(err.message);
  }
}
async function doRegister(e) {
  e.preventDefault();
  const f = e.target;
  try {
    const data = await api('/api/register', {
      method: 'POST',
      body: JSON.stringify({
        username: f.username.value.trim(),
        password: f.password.value,
        displayName: f.displayName.value.trim()
      })
    });
    token = data.token;
    currentUser = data.user;
    localStorage.setItem('tempo_token', token);
    enterApp();
  } catch (err) {
    showAuthError(err.message);
  }
}
function logout(silent) {
  token = null;
  currentUser = null;
  classrooms = [];
  currentClassroom = null;
  localStorage.removeItem('tempo_token');
  document.getElementById('appShell').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.body.classList.remove('logged-in');
  closeSidebar();
  if (!silent) toast('Logged out');
}
async function enterApp() {
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('appShell').classList.remove('hidden');
  document.body.classList.add('logged-in');
  document.getElementById('userLabel').textContent = currentUser.displayName || currentUser.username;
  await loadClassrooms();
  page = 'dashboard';
  render();
}
async function loadClassrooms() {
  classrooms = await api('/api/classrooms');
}

// Boot
(async function init() {
  if (token) {
    try {
      currentUser = await api('/api/me');
      await enterApp();
      return;
    } catch (e) {
      localStorage.removeItem('tempo_token');
      token = null;
    }
  }
  // stay on auth screen
})();

// ========== NAV & RENDER ==========
function navRender() {
  if (!currentClassroom) {
    nav.innerHTML = `<button class="${page==='dashboard'?'active':''}" onclick="showDashboard()">Dashboard</button>
    <button class="${page==='calendar'?'active':''}" onclick="showGlobalCalendar()">Calendar</button>`;
  } else {
    nav.innerHTML = `<button class="${page==='main'?'active':''}" onclick="showClassMain()">Main UI</button>
    <button class="${page==='institutes'?'active':''}" onclick="showInstitutes()">View Institutes</button>
    <button class="${page==='subjects'?'active':''}" onclick="showSubjects()">Subjects</button>
    <button class="back" onclick="leaveClass()">← Back to Dashboard</button>`;
  }
}
function render() {
  navRender();
  if (page === 'dashboard') dashboard();
  else if (page === 'calendar') globalCalendar();
  else if (page === 'main') classMain();
  else if (page === 'institutes') institutes();
  else if (page === 'subjects') subjects();
}
function showDashboard() { currentClassroom = null; page = 'dashboard'; render(); }
function showGlobalCalendar() { currentClassroom = null; page = 'calendar'; render(); }
async function openClass(id) {
  currentClassroom = classrooms.find(c => c.id === id);
  if (!currentClassroom) {
    // refresh
    await loadClassrooms();
    currentClassroom = classrooms.find(c => c.id === id);
  }
  page = 'main';
  calendarDate = new Date();
  selectedDate = new Date().toISOString().slice(0,10);
  render();
}
function leaveClass() { currentClassroom = null; page = 'dashboard'; render(); }
function showClassMain() { page = 'main'; render(); }
function showInstitutes() { page = 'institutes'; render(); }
function showSubjects() { page = 'subjects'; selectedSubject = null; render(); }

// ========== DASHBOARD ==========
function dashboard() {
  app.innerHTML = `<div class="topbar"><div><h1>Scheduling and Event Reminder</h1>
  <p>Organize classroom schedules, activities, events, subjects, and teacher information. Data is stored on the server.</p></div>
  <button class="plus" onclick="openClassroomModal()">+</button></div>
  <div class="panel"><div class="toolbar"><div><h2>Classrooms</h2><p class="muted small">Your classrooms — secured by your account.</p></div></div>
  <div class="class-grid">${classrooms.length ? classrooms.map(c => `
    <div class="card class-card" onclick="openClass('${c.id}')">
      <h3>${esc(c.name)}</h3>
      <p class="muted">${c.studentCount} students</p>
      <p>${esc(c.description || 'No description.')}</p>
      <p class="small"><b>Main Adviser:</b> ${esc(c.mainAdviser || 'Not assigned')}</p>
      <p class="small"><b>Subjects:</b> ${(c.subjects || []).length}</p>
    </div>`).join('') : `<div class="card"><p>No classrooms yet. Tap <b>+</b> to create one.</p></div>`}
  </div></div>`;
}

function openClassroomModal() {
  app.insertAdjacentHTML('beforeend', `<div class="modal" id="modal"><div class="modal-box">
    <div class="toolbar"><h2>Create Classroom</h2><button class="secondary" onclick="closeModal()">Close</button></div>
    <form onsubmit="createClassroom(event)">
      <div class="form-grid">
        <div><label>Classroom / Section Name</label><input name="name" required placeholder="e.g. Grade 12 - ICT A"></div>
        <div><label>Number of Students</label><input name="students" type="number" min="0" value="30"></div>
        <div><label>Main Adviser</label><input name="adviser" placeholder="Teacher name"></div>
        <div><label>Classroom Description</label><input name="description" placeholder="Short description"></div>
        <div class="full"><label>Sub Teachers</label><div id="teachers" class="dynamic"></div>
          <button type="button" class="secondary" onclick="addTeacher()">+ Add Teacher</button></div>
        <div class="full"><label>Subjects</label><div id="subjects" class="dynamic"></div>
          <button type="button" class="secondary" onclick="addSubject()">+ Add Subject</button></div>
      </div>
      <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button>
        <button class="primary">Create Classroom</button></div>
    </form></div></div>`);
  addTeacher(); addSubject();
}
function closeModal() { document.getElementById('modal')?.remove(); }
function addTeacher() {
  document.getElementById('teachers').insertAdjacentHTML('beforeend',
    `<div class="dynamic-row"><input class="teacher-input" placeholder="Sub teacher name">
     <button type="button" class="secondary" onclick="this.parentElement.remove()">×</button></div>`);
}
function addSubject() {
  document.getElementById('subjects').insertAdjacentHTML('beforeend',
    `<div class="card" style="margin:8px 0"><div class="form-grid">
      <input class="subject-name" placeholder="Subject name">
      <input class="subject-teacher" placeholder="Teacher">
      <textarea class="subject-description full" placeholder="Subject description"></textarea>
    </div><button type="button" class="secondary" onclick="this.parentElement.remove()">Remove</button></div>`);
}
async function createClassroom(e) {
  e.preventDefault();
  const f = e.target;
  const teachers = [...document.querySelectorAll('.teacher-input')].map(x => x.value.trim()).filter(Boolean)
    .map(name => ({ id: crypto.randomUUID(), name, role: 'Sub Teacher' }));
  const adviser = f.adviser.value.trim();
  if (adviser) teachers.unshift({ id: crypto.randomUUID(), name: adviser, role: 'Main Adviser' });
  const subjects = [...document.querySelectorAll('#subjects .card')].map(x => ({
    id: crypto.randomUUID(),
    name: x.querySelector('.subject-name').value.trim(),
    teacher: x.querySelector('.subject-teacher').value.trim(),
    description: x.querySelector('.subject-description').value.trim()
  })).filter(x => x.name);

  try {
    const c = await api('/api/classrooms', {
      method: 'POST',
      body: JSON.stringify({
        name: f.name.value.trim(),
        studentCount: Number(f.students.value || 0),
        mainAdviser: adviser,
        description: f.description.value.trim(),
        subTeachers: teachers,
        subjects
      })
    });
    classrooms.unshift(c);
    closeModal();
    toast('Classroom saved');
    openClass(c.id);
  } catch (err) {
    alert(err.message);
  }
}

// ========== CALENDAR ==========
function monthTitle(d) { return d.toLocaleString('en-US', { month: 'long', year: 'numeric' }); }
function moveMonth(delta) { calendarDate.setMonth(calendarDate.getMonth() + delta); render(); }
function calendarHtml(items, onSelect = 'selectDate') {
  const y = calendarDate.getFullYear(), m = calendarDate.getMonth();
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  let h = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x => `<div class="week">${x}</div>`).join('');
  for (let i = 0; i < first; i++) h += `<div class="day"></div>`;
  for (let d = 1; d <= days; d++) {
    const date = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = items.filter(x => x.item_date === date).length;
    h += `<div class="day ${date===selectedDate?'selected':''} ${count?'has-items':''}" onclick="${onSelect}('${date}')">
      <div class="day-num">${d}</div>${count ? `<span class="badge">${count} item${count>1?'s':''}</span>` : ''}</div>`;
  }
  return h;
}
function selectDate(date) { selectedDate = date; render(); }

// ========== CLASS MAIN ==========
function classMain() {
  const items = currentClassroom.items || [];
  app.innerHTML = `<div class="topbar"><div><h1>${esc(currentClassroom.name)}</h1><p class="muted">Classroom Main UI</p></div></div>
  <div class="panel"><div class="toolbar"><h2>${monthTitle(calendarDate)}</h2>
    <div class="row"><button class="secondary" onclick="moveMonth(-1)">‹</button>
    <button class="secondary" onclick="moveMonth(1)">›</button></div></div>
    <div class="calendar">${calendarHtml(items)}</div></div>
  <div class="panel" style="margin-top:18px">
    <div class="folder-head"><div><h2>Folder</h2><p class="muted small">Items for ${selectedDate}</p></div>
      <div class="folder-add"><button class="plus" onclick="toggleAddMenu()">+</button>
        <div id="addMenu" class="add-menu hidden">
          <button onclick="openItemModal('event')">Add Events</button>
          <button onclick="openItemModal('activity')">Add Activities</button>
        </div>
      </div>
    </div>
    <div>${items.filter(x => x.item_date === selectedDate).length
      ? items.filter(x => x.item_date === selectedDate).map(itemHtml).join('')
      : `<p class="muted">No events or activities for this date.</p>`}</div>
  </div>`;
}
function toggleAddMenu() { document.getElementById('addMenu')?.classList.toggle('hidden'); }
function itemHtml(i) {
  return `<div class="item"><div class="item-main">
    <div class="type">${esc(i.item_type)}</div>
    <b>${esc(i.subject || 'General')}</b>
    <p>${esc(i.details)}</p>
    <span class="small muted">Published by ${esc(i.publisher || 'Unknown')}</span>
  </div>${i.picture ? `<img src="${i.picture}">` : ''}
  <button class="secondary" onclick="deleteItem('${i.id}')">Delete</button></div>`;
}
function openItemModal(type) {
  itemType = type;
  document.getElementById('addMenu')?.classList.add('hidden');
  app.insertAdjacentHTML('beforeend', `<div class="modal" id="modal"><div class="modal-box">
    <div class="toolbar"><h2>Add ${type === 'event' ? 'Event' : 'Activity'}</h2>
      <button class="secondary" onclick="closeModal()">Close</button></div>
    <form onsubmit="submitItem(event)">
      <div class="form-grid">
        <div><label>Date</label><input name="date" type="date" value="${selectedDate}" required></div>
        <div><label>Subject</label>
          <select name="subjectId"><option value="">General</option>
          ${(currentClassroom.subjects || []).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
          </select></div>
        <div><label>Publisher</label><input name="publisher" placeholder="Name"></div>
        <div><label>Picture (optional)</label><input name="picture" type="file" accept="image/*"></div>
        <div class="full"><label>Details</label><textarea name="details" required placeholder="Enter event/activity details"></textarea></div>
      </div>
      <div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button>
        <button class="primary">Save ${type}</button></div>
    </form></div></div>`);
}
async function submitItem(e) {
  e.preventDefault();
  const f = e.target;
  const subjectId = f.subjectId.value || null;
  const subj = (currentClassroom.subjects || []).find(s => s.id === subjectId);
  const formData = new FormData();
  formData.append('item_date', f.date.value);
  formData.append('item_type', itemType);
  formData.append('details', f.details.value.trim());
  formData.append('publisher', f.publisher.value.trim());
  if (subjectId) formData.append('subject_id', subjectId);
  if (subj) formData.append('subject', subj.name);
  if (f.picture.files[0]) formData.append('picture', f.picture.files[0]);

  try {
    const item = await api(`/api/classrooms/${currentClassroom.id}/items`, {
      method: 'POST',
      body: formData,
      headers: {} // let browser set multipart
    });
    if (!currentClassroom.items) currentClassroom.items = [];
    currentClassroom.items.push(item);
    // also update in classrooms array
    const idx = classrooms.findIndex(c => c.id === currentClassroom.id);
    if (idx >= 0) classrooms[idx] = currentClassroom;
    selectedDate = f.date.value;
    closeModal();
    toast('Saved');
    render();
  } catch (err) {
    alert(err.message);
  }
}
async function deleteItem(id) {
  if (!confirm('Delete this item?')) return;
  try {
    await api(`/api/classrooms/${currentClassroom.id}/items/${id}`, { method: 'DELETE' });
    currentClassroom.items = (currentClassroom.items || []).filter(i => i.id !== id);
    toast('Item deleted');
    render();
  } catch (err) {
    alert(err.message);
  }
}

// ========== GLOBAL CALENDAR ==========
async function globalCalendar() {
  let allItems = [];
  try {
    allItems = await api('/api/calendar');
  } catch (e) { /* ignore */ }
  app.innerHTML = `<div class="topbar"><div><h1>Calendar</h1>
    <p class="muted">Overview of saved dates across your classrooms.</p></div></div>
  <div class="panel"><div class="toolbar"><h2>${monthTitle(calendarDate)}</h2>
    <div class="row"><button class="secondary" onclick="moveMonth(-1)">‹</button>
    <button class="secondary" onclick="moveMonth(1)">›</button></div></div>
    <div class="calendar">${calendarHtml(allItems, 'globalDate')}</div></div>`;
}
function globalDate(date) {
  selectedDate = date;
  alert('Select a classroom from Dashboard to view this date\'s folder.');
}

// ========== INSTITUTES & SUBJECTS ==========
function institutes() {
  app.innerHTML = `<div class="topbar"><div><h1>View Institutes</h1>
    <p class="muted">Classroom and teacher information.</p></div></div>
  <div class="panel"><h2>${esc(currentClassroom.name)}</h2>
    <p>${esc(currentClassroom.description || 'No classroom description.')}</p>
    <div class="info-grid">
      <div class="info-box"><b>Students</b><div>${currentClassroom.studentCount}</div></div>
      <div class="info-box"><b>Main Adviser</b><div>${esc(currentClassroom.mainAdviser || 'Not assigned')}</div></div>
      <div class="info-box"><b>Subjects</b><div>${(currentClassroom.subjects || []).length}</div></div>
    </div>
    <h3 style="margin-top:25px">Teachers</h3>
    <ul class="teacher-list">${(currentClassroom.subTeachers || []).map(t =>
      `<li>${esc(t.name)} — ${esc(t.role)}</li>`).join('') || '<li>No teachers listed.</li>'}</ul>
    <h3>Subjects and Teachers</h3>
    <ul class="subject-list">${(currentClassroom.subjects || []).map(s =>
      `<li><b>${esc(s.name)}</b> — ${esc(s.teacher || 'No teacher assigned')}<br>
       <span class="muted">${esc(s.description || '')}</span></li>`).join('') || '<li>No subjects.</li>'}</ul>
  </div>`;
}
function subjects() {
  if (selectedSubject) { subjectDetail(); return; }
  app.innerHTML = `<div class="topbar"><div><h1>Subjects</h1>
    <p class="muted">Select a subject to view its events and activities.</p></div></div>
  <div class="subject-grid">${(currentClassroom.subjects || []).map(s => `
    <div class="card subject-card" onclick="selectedSubject='${s.id}';render()">
      <h3>${esc(s.name)}</h3>
      <p><b>Teacher:</b> ${esc(s.teacher || 'Not assigned')}</p>
      <p class="muted">${esc(s.description || 'No description.')}</p>
    </div>`).join('') || `<div class="card">No subjects created.</div>`}</div>`;
}
function subjectDetail() {
  const s = (currentClassroom.subjects || []).find(x => x.id === selectedSubject);
  if (!s) { selectedSubject = null; render(); return; }
  const items = (currentClassroom.items || []).filter(i => i.subject_id === s.id);
  app.innerHTML = `<div class="topbar"><div><h1>${esc(s.name)}</h1>
    <p class="muted">Teacher: ${esc(s.teacher || 'Not assigned')}</p></div>
    <button class="secondary" onclick="selectedSubject=null;render()">← Subjects</button></div>
  <div class="panel"><h3>Description</h3><p>${esc(s.description || 'No description.')}</p>
    <h3 style="margin-top:25px">Activities and Events</h3>
    ${items.length ? `<div class="table-wrap"><table class="event-table">
      <thead><tr><th>Date</th><th>Type</th><th>Details</th><th>Publisher</th></tr></thead>
      <tbody>${items.map(i => `<tr>
        <td>${esc(i.item_date)}</td><td>${esc(i.item_type)}</td>
        <td>${esc(i.details)}</td><td>${esc(i.publisher || '—')}</td></tr>`).join('')}
      </tbody></table></div>` : `<p class="muted">No events or activities have been added for this subject.</p>`}
  </div>`;
}
</script>
